owner: vagocat
repo: status

sites:
  - name: Website
    url: https://vagocat.com/api/health/
    icon: https://vagocat.com/images/favicon-32.png
  - name: Client Area
    url: https://my.vagocat.com/login
  - name: Hosting Control Panel
    url: https://panel.vagocat.com:8083/login/
  - name: Webmail
    url: https://webmail.vagocat.com/
  - name: Email (IMAP)
    check: "tcp-ping"
    url: mail.vagocat.com
    port: 993

status-website:
  cname: status.vagocat.com
  logoUrl: /logo-h120.png
  favicon: /favicon-32.png
  favicon-png: /icon-192.png
  name: Vagocat Status
  introTitle: "Vagocat system status"
  introMessage: Live status of Vagocat services, checked every 5 minutes from outside our network. Need help? Contact us at [vagocat.com/contact](https://vagocat.com/contact).
  theme: dark
  navbar:
    - title: Status
      href: /
    - title: Vagocat.com
      href: https://vagocat.com
    - title: Support
      href: https://my.vagocat.com
  css: |
    :root{--body-background-color:#0d1117;--body-text-color:#e5e7eb;--card-background-color:#161b22;--card-border-color:#30363d;--nav-background-color:#0d1117;--nav-border-bottom-color:#673da6;--link-color:#a78bfa;--up-border-left-color:#22c55e;--down-border-left-color:#ef4444;--degraded-border-left-color:#f59e0b}
    body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
    h1,h2,h3{font-family:Outfit,Inter,system-ui,sans-serif;letter-spacing:-.01em}
    nav img{height:40px;width:auto}
    article.up,article.down,article.degraded{border-radius:0;box-shadow:4px 4px 0 #673da6}
    a{color:#a78bfa}

workflowSchedule:
  graphs: "0 0 * * *"
  responseTime: "0 23 * * *"
  staticSite: "0 1 * * *"
  summary: "0 0 * * *"
  updateTemplate: "0 0 * * *"
  updates: "0 3 * * *"
  uptime: "*/5 * * * *"

commitMessages:
  commitAuthorName: "Vagocat"
  commitAuthorEmail: "vago.tech1@gmail.com"
