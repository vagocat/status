owner: vagocat
repo: status

sites:
  - name: Website
    icon: https://raw.githubusercontent.com/vagocat/status/master/brand/favicon-32.png
    url: https://vagocat.com/api/health/
  - name: Client Area
    icon: https://raw.githubusercontent.com/vagocat/status/master/brand/favicon-32.png
    url: https://my.vagocat.com/login
  - name: Hosting Control Panel
    icon: https://raw.githubusercontent.com/vagocat/status/master/brand/favicon-32.png
    url: https://panel.vagocat.com:8083/login/
  - name: Webmail
    icon: https://raw.githubusercontent.com/vagocat/status/master/brand/favicon-32.png
    url: https://webmail.vagocat.com/
  - name: Email (IMAP)
    icon: https://raw.githubusercontent.com/vagocat/status/master/brand/favicon-32.png
    check: "tcp-ping"
    url: mail.vagocat.com
    port: 993

status-website:
  cname: status.vagocat.com
  logoUrl: https://raw.githubusercontent.com/vagocat/status/master/brand/logo-h120.png
  favicon: https://raw.githubusercontent.com/vagocat/status/master/brand/favicon-32.png
  favicon-png: https://raw.githubusercontent.com/vagocat/status/master/brand/icon-192.png
  name: Vagocat Status
  hideNavTitle: true
  introTitle: "Vagocat system status"
  introMessage: Live status of Vagocat services, checked every 5 minutes from outside our network. Need help? Contact us at [vagocat.com/contact](https://vagocat.com/contact).
  theme: dark
  navbar:
    - title: Status
      href: /
    - title: Vagocat.com
      href: https://vagocat.com
    - title: Support
      href: https://my.vagocat.com
  css: |
    :root{--body-background-color:#0d1117;--body-text-color:#e5e7eb;--card-background-color:#161b22;--card-border-color:#30363d;--nav-background-color:#0d1117;--nav-border-bottom-color:#30363d;--nav-current-border-bottom-color:#8b5cf6;--up-border-left-color:#22c55e;--down-border-left-color:#ef4444;--down-background-color:#3b1219;--degraded-border-left-color:#f59e0b;--tag-color:#0d1117;--tag-up-background-color:#22c55e;--tag-down-background-color:#ef4444;--tag-degraded-background-color:#f59e0b;--change-background-color:#f59e0b;--error-button-border-color:#4c2a85;--error-button-background-color:#673da6;--error-button-color:#fff;--submit-button-border-color:#4c2a85;--submit-button-background-color:#673da6;--submit-button-color:#fff;--graph-opacity:.45;--graph-filter:hue-rotate(95deg) saturate(1.4)}
    nav{border-bottom-width:2px}
    nav .logo{margin-right:1rem}
    article.graph{background-image:none!important}
    nav .logo img{height:44px;width:auto}
    h1{font-weight:700;letter-spacing:-.02em}
    h2{font-weight:600}
    main a{color:#a78bfa}
    article{border-radius:0!important}
    main>article.up,main>article.down,main>article.degraded,section.live-status article{box-shadow:4px 4px 0 #673da6}
    section.live-status article+article{margin-top:.9rem}
    footer,footer a{color:#9ca3af}
    @media (max-width:560px){nav li:first-child{display:none!important} nav{padding:0 .25rem!important} nav ul a{padding:1.2rem .5rem!important;font-size:.92rem} nav .logo{margin-right:.25rem!important} nav .logo img{height:32px!important;margin-right:0!important} main.container{padding:0 1rem}}

workflowSchedule:
  graphs: "0 0 * * *"
  responseTime: "0 23 * * *"
  staticSite: "0 1 * * *"
  summary: "0 0 * * *"
  updateTemplate: "0 0 * * *"
  updates: "0 3 * * *"
  uptime: "*/5 * * * *"

commitMessages:
  commitAuthorName: "Vagocat"
  commitAuthorEmail: "vago.tech1@gmail.com"
