name: Service check
on:
  schedule:
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, deleted]
permissions:
  contents: write
  issues: write
concurrency:
  group: service-check
  cancel-in-progress: false
jobs:
  check:
    if: github.event_name != 'issues' || github.actor == 'vagocat'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check services and publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 check.py
          mkdir out && mv status.json out/ && cd out
          git init -q -b data
          git config user.name Vagocat
          git config user.email "vagocat@users.noreply.github.com"
          git add status.json && git commit -qm "Status update"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
